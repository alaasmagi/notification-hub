name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-notification-hub
  cancel-in-progress: true

env:
  IMAGE_NAME: alaasmagi-notification-hub
  REMOTE_APP_DIR: /home/github-actions/infra/notification-hub
  APP_PORT: "2500"
  HOST_PORT: "2500"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       contains(github.event.head_commit.message, '[DEPLOY]'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build --pull --file Web/Dockerfile -t "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Save Docker image
        run: |
          set -euo pipefail
          docker save "${IMAGE_NAME}:${GITHUB_SHA}" | gzip > image.tar.gz

      - name: Create runtime env file from GitHub secrets
        env:
          APP_PORT: ${{ env.APP_PORT }}
          HOST_PORT: ${{ env.HOST_PORT }}
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          RABBITMQ_URI: ${{ secrets.RABBITMQ_URI }}
          RABBITMQ_QUEUE: ${{ secrets.RABBITMQ_QUEUE }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_BASE_URL: ${{ secrets.BREVO_BASE_URL }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
          GLITCHTIP_RELEASE: ${{ secrets.GLITCHTIP_RELEASE }}
          KEYCLOAK_AUTHORITY: ${{ secrets.KEYCLOAK_AUTHORITY }}
          KEYCLOAK_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          : "${DATABASE_CONNECTION_STRING:?DATABASE_CONNECTION_STRING is required}"
          : "${RABBITMQ_URI:?RABBITMQ_URI is required}"
          : "${RABBITMQ_QUEUE:?RABBITMQ_QUEUE is required}"
          : "${BREVO_API_KEY:?BREVO_API_KEY is required}"
          : "${BREVO_BASE_URL:?BREVO_BASE_URL is required}"
          : "${GLITCHTIP_DSN:?GLITCHTIP_DSN is required}"
          : "${GLITCHTIP_RELEASE:?GLITCHTIP_RELEASE is required}"
          : "${KEYCLOAK_AUTHORITY:?KEYCLOAK_AUTHORITY is required}"
          : "${KEYCLOAK_CLIENT_ID:?KEYCLOAK_CLIENT_ID is required}"
          : "${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET is required}"

          {
            printf 'ASPNETCORE_ENVIRONMENT=%s\n' 'Production'
            printf 'APP_PORT=%s\n' "${APP_PORT}"
            printf 'HOST_PORT=%s\n' "${HOST_PORT}"
            printf 'ASPNETCORE_URLS=%s\n' "http://+:${APP_PORT}"

            printf 'DATABASE_CONNECTION_STRING=%s\n' "${DATABASE_CONNECTION_STRING}"

            printf 'RABBITMQ_URI=%s\n' "${RABBITMQ_URI}"
            printf 'RABBITMQ_QUEUE=%s\n' "${RABBITMQ_QUEUE}"

            printf 'BREVO_API_KEY=%s\n' "${BREVO_API_KEY}"
            printf 'BREVO_BASE_URL=%s\n' "${BREVO_BASE_URL}"

            printf 'GLITCHTIP_DSN=%s\n' "${GLITCHTIP_DSN}"
            printf 'GLITCHTIP_RELEASE=%s\n' "${GLITCHTIP_RELEASE}"

            printf 'KEYCLOAK_AUTHORITY=%s\n' "${KEYCLOAK_AUTHORITY}"
            printf 'KEYCLOAK_CLIENT_ID=%s\n' "${KEYCLOAK_CLIENT_ID}"
            printf 'KEYCLOAK_CLIENT_SECRET=%s\n' "${KEYCLOAK_CLIENT_SECRET}"
          } > .env

          chmod 600 .env

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -T 30 -H -p "${PORT}" "${VPS_HOST}" >> ~/.ssh/known_hosts || \
            echo "Warning: ssh-keyscan failed for VPS_HOST on port ${PORT}; SSH will use StrictHostKeyChecking=accept-new."

      - name: Upload image and compose files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          PORT="${VPS_PORT:-22}"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p "${PORT}" "${VPS_USER}@${VPS_HOST}" \
            "mkdir -p '${REMOTE_APP_DIR}' && chown '${VPS_USER}:${VPS_USER}' '${REMOTE_APP_DIR}'"

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -P "${PORT}" \
            image.tar.gz .env compose.yaml \
            "${VPS_USER}@${VPS_HOST}:${REMOTE_APP_DIR}/"

      - name: Run docker compose on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          APP_PORT: ${{ env.APP_PORT }}
          HOST_PORT: ${{ env.HOST_PORT }}
        run: |
          set -euo pipefail

          PORT="${VPS_PORT:-22}"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p "${PORT}" "${VPS_USER}@${VPS_HOST}" \
            IMAGE_NAME="${IMAGE_NAME}" \
            IMAGE_TAG="${GITHUB_SHA}" \
            REMOTE_APP_DIR="${REMOTE_APP_DIR}" \
            APP_PORT="${APP_PORT}" \
            HOST_PORT="${HOST_PORT}" \
            'bash -s' <<'EOF_REMOTE'
          set -euo pipefail

          if docker info >/dev/null 2>&1; then
            DOCKER="docker"
          else
            DOCKER="sudo docker"
          fi

          if $DOCKER compose version >/dev/null 2>&1; then
            COMPOSE_CMD=($DOCKER compose)
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE_CMD=(docker-compose)
          else
            echo "Docker Compose is required on the target host." >&2
            exit 1
          fi

          cd "$REMOTE_APP_DIR"

          gunzip -c image.tar.gz | $DOCKER load

          chmod 600 .env

          $DOCKER network inspect infra-network >/dev/null 2>&1 || $DOCKER network create infra-network

          export IMAGE_NAME IMAGE_TAG APP_PORT HOST_PORT
          "${COMPOSE_CMD[@]}" --env-file .env -f compose.yaml up -d --remove-orphans

          $DOCKER image prune -f
          EOF_REMOTE
